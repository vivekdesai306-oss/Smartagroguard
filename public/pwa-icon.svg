<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Leaf Core Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Accent Gold / Sunlight -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle grid lines indicating AI / Smart Agriculture -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Glowing AgroGuard Shield -->
  <path d="M256 70 L390 135 C390 270 256 385 256 425 C256 385 122 270 122 135 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.2"
        stroke="url(#shieldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Protective Shield Layer -->
  <path d="M256 95 L370 150 C370 260 256 355 256 390 C256 355 142 260 142 150 Z"
        fill="#064E3B"
        fill-opacity="0.6" />

  <!-- Sprouting Crop Leaf / Plant Icon -->
  <!-- Left Leaf -->
  <path d="M256 310 C210 270 180 200 210 160 C250 160 260 240 256 310 Z"
        fill="url(#leafGrad)" />

  <!-- Right Leaf -->
  <path d="M256 310 C302 270 332 200 302 160 C262 160 252 240 256 310 Z"
        fill="url(#leafGrad)" />

  <!-- Main Center Sprout Stem -->
  <path d="M256 350 L256 210"
        stroke="#A7F3D0"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Top Center Sprout Leaf -->
  <path d="M256 160 C240 190 250 220 256 240 C262 220 272 190 256 160 Z"
        fill="#6EE7B7" />

  <!-- AI / Sensor Data Nodes (representing smart detection) -->
  <circle cx="210" cy="160" r="7" fill="#FDE047" />
  <circle cx="302" cy="160" r="7" fill="#FDE047" />
  <circle cx="256" cy="125" r="9" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Subtitle Text / Badge -->
  <text x="256" y="470"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="4"
        fill="#34D399"
        text-anchor="middle">AGROGUARD</text>
</svg>
